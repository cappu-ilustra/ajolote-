<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>Ajolotito Panadero</title>

    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-container {
            position: relative;
            max-width: 100%;
            max-height: 100vh;
        }

        video {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }

        .instagram-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 55px;
            border-radius: 50%;
            background: white;
            padding: 5px;

            opacity: 0;
            transform: translateY(-10px);
            animation: fadeIn 0.8s ease forwards;
            animation-delay: 0.3s;
        }

        .instagram-btn:hover {
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>
<body>

    <div class="video-container">

    <video autoplay muted loop>
        <source src="ajolote_calaverita.mp4" type="video/mp4">
    </video>

    <a href="https://www.instagram.com/cappu_ilustra/?hl=es" target="_blank">
        <img class="instagram-btn" src="boton_rosa_2.png" alt="Instagram">
    </a>

</div>

</body>
</html>
